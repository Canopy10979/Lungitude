name: Research checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r ml/tabular/requirements.txt httpx pillow opencv-python-headless python-multipart -r ml/skin/auth-requirements.txt
      - run: python -m compileall -q ml backend tools
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/skin-state.cjs
      - run: node tests/account-state.cjs
      - run: node tests/account-providers.cjs
      - run: npm run test:browser
