# nginx site for Lungitude. Replace example.org and the paths.
# HTTPS certificate: sudo certbot --nginx -d example.org
server {
    listen 443 ssl http2;
    server_name example.org;
    root /var/www/lungitude;
    index index.html;

    # ssl_certificate and ssl_certificate_key are added by certbot.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 64k;

    # Private files and folders.
    location ~ ^/(tools|tests|ml|deploy)(/|$)          { return 404; }
    location ~* ^/data/.*\.(sqlite|csv)$               { return 404; }
    location ~ ^/data/scp(/|$)                          { return 404; }
    location ~ ^/api/(secrets|config|lib|geo|store|db)(\.example)?\.php$ { return 404; }
    location ~ /\.                                      { return 404; }
    location ~* \.md$                                   { return 404; }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/api/[a-z_]+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ { return 404; }
}

server {
    listen 80;
    server_name example.org;
    return 301 https://$host$request_uri;
}
